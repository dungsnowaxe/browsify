<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Top Loop Gradient (Sunset Coral / Magenta) -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5370"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Bottom Loop Gradient (Electric Cyan / Azure) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Stem Gradient (Beam) -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Icon Base -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg1)" filter="url(#cardShadow)"/>
  <!-- Subtle inner glass rim -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Subtle Speed Routing Grid / Orbit Arcs -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Logo Mark: Stylized 'B' with Multi-Track Optical Routing -->
  <g filter="url(#glow1)">
    <!-- Back Glow Underlays -->
    <path d="M 170 380 L 170 132" fill="none" stroke="url(#stemGrad)" stroke-width="42" stroke-linecap="round" opacity="0.3"/>
    <path d="M 170 142 C 240 142, 335 150, 335 220 C 335 272, 260 278, 170 278" fill="none" stroke="url(#coralGrad)" stroke-width="36" stroke-linecap="round" opacity="0.3"/>
    <path d="M 170 278 C 270 278, 360 286, 360 360 C 360 425, 250 425, 170 425" fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" opacity="0.3"/>

    <!-- Sharp Main Vectors -->
    <!-- Central Spine (Incoming Fast URL Stream) -->
    <path d="M 170 376 L 170 136" fill="none" stroke="url(#stemGrad)" stroke-width="32" stroke-linecap="round"/>

    <!-- Top Loop (Work Profile / Chromium Route) -->
    <path d="M 170 146 C 245 146, 330 154, 330 220 C 330 270, 260 276, 170 276" fill="none" stroke="url(#coralGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Bottom Loop (Personal Profile / Firefox Route) -->
    <path d="M 170 276 C 265 276, 350 282, 350 354 C 350 416, 250 416, 170 416" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Junction Dots / Dispatch Nodes -->
    <circle cx="170" cy="146" r="14" fill="#FFFFFF" />
    <circle cx="170" cy="276" r="16" fill="#FFFFFF" />
    <circle cx="170" cy="416" r="14" fill="#FFFFFF" />
    
    <!-- Pulse Center Core -->
    <circle cx="170" cy="276" r="8" fill="#38BDF8" />
    
    <!-- Dynamic Terminal Direction Pointers (Micro Arrows) -->
    <polygon points="325,208 340,225 320,228" fill="#FF5370" />
    <polygon points="345,340 362,358 340,363" fill="#00F2FE" />
  </g>
</svg>
