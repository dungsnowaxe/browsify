<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Dark Carbon & Rust Obsidian -->
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Rust & Fire Gradient 1 -->
    <linearGradient id="rustFire1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Rust & Fire Gradient 2 -->
    <linearGradient id="rustFire2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg3)" filter="url(#cardShadow3)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Speed Streaks in Background -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-linecap="round">
    <line x1="80" y1="180" x2="130" y2="180" stroke-width="4"/>
    <line x1="60" y1="256" x2="120" y2="256" stroke-width="6"/>
    <line x1="90" y1="332" x2="135" y2="332" stroke-width="4"/>
  </g>

  <!-- High Velocity 'B' Monogram -->
  <g filter="url(#glow3)">
    <!-- Aerodynamic Forward Spine -->
    <path d="M 160 380 L 160 132 C 160 132, 230 132, 290 132 C 345 132, 375 160, 375 204 C 375 244, 340 264, 280 264 L 160 264" 
          fill="none" stroke="url(#rustFire1)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Accelerating Loop with Arrow Thrust -->
    <path d="M 160 264 L 290 264 C 360 264, 395 292, 395 340 C 395 384, 350 408, 285 408 L 160 408" 
          fill="none" stroke="url(#rustFire2)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Speed Notch / Jet Chevrons -->
    <polygon points="280,250 310,264 280,278" fill="#FFFFFF"/>
    <polygon points="280,394 310,408 280,422" fill="#FFFFFF"/>
    <polygon points="280,118 310,132 280,146" fill="#FFFFFF"/>

    <!-- Precision Core -->
    <circle cx="160" cy="264" r="16" fill="#FFFFFF"/>
    <circle cx="160" cy="264" r="8" fill="#F97316"/>
  </g>
</svg>
