<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate & Twilight -->
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="60%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>

    <!-- Emerald to Cyan Nav Track -->
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Radiant Purple Branch -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg2)" filter="url(#cardShadow2)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Compass / Radar Dial Subtle Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.3"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 6" opacity="0.2"/>
  
  <!-- Subtle Dial Ticks -->
  <line x1="256" y1="86" x2="256" y2="102" stroke="#38BDF8" stroke-width="2.5" opacity="0.6"/>
  <line x1="256" y1="410" x2="256" y2="426" stroke="#38BDF8" stroke-width="2.5" opacity="0.4"/>
  <line x1="86" y1="256" x2="102" y2="256" stroke="#38BDF8" stroke-width="2.5" opacity="0.4"/>
  <line x1="410" y1="256" x2="426" y2="256" stroke="#38BDF8" stroke-width="2.5" opacity="0.6"/>

  <!-- Main Compass Router Geometry -->
  <g filter="url(#glow2)">
    <!-- Incoming URL Path from Bottom-Left -->
    <path d="M 120 392 Q 190 320, 256 256" fill="none" stroke="url(#routeGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Dispatched Path 1: Work / Primary (Top-Right Arrow) -->
    <path d="M 256 256 Q 320 190, 386 126" fill="none" stroke="url(#routeGrad)" stroke-width="26" stroke-linecap="round"/>
    <!-- Top-Right Arrow Head -->
    <polygon points="360,116 398,114 396,152" fill="#3B82F6"/>

    <!-- Dispatched Path 2: Secondary / Personal Profile (Bottom-Right Curved Arrow) -->
    <path d="M 256 256 Q 320 280, 386 350" fill="none" stroke="url(#purpleGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Bottom-Right Arrow Head -->
    <polygon points="360,360 394,362 390,326" fill="#EC4899"/>

    <!-- Dispatched Path 3: Fast Hook (Top-Left Micro-Route) -->
    <path d="M 256 256 Q 220 200, 150 160" fill="none" stroke="#10B981" stroke-width="16" stroke-linecap="round" stroke-dasharray="8 6"/>
    <circle cx="146" cy="158" r="8" fill="#10B981"/>

    <!-- Central Switch Crystal Hub -->
    <circle cx="256" cy="256" r="32" fill="#0B132B" stroke="#00F2FE" stroke-width="5"/>
    <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="8" fill="#00F2FE"/>

    <!-- Origin Node -->
    <circle cx="120" cy="392" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
