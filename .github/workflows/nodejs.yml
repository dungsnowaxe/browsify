name: Rust & UI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/browsify-ui/package-lock.json
      - name: Check & Build UI
        working-directory: ./apps/browsify-ui
        run: |
          npm ci
          npm run check
          npm run build
