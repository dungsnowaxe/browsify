name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      RELEASE_TAG: ${{ github.ref_name }}
      BROWSIFY_UPDATE_PUBLIC_KEY: ${{ vars.BROWSIFY_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Validate release tag
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "browsify") | .version')
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$version"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/browsify-ui/package-lock.json
      - name: Install UI dependencies
        run: ./scripts/install.sh
      - name: Check and test UI
        working-directory: apps/browsify-ui
        run: |
          npm run check
          npm test
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Build Apple Silicon release with update verification
        run: |
          test -n "$BROWSIFY_UPDATE_PUBLIC_KEY" || { echo 'Configure BROWSIFY_UPDATE_PUBLIC_KEY before releasing'; exit 1; }
          ./scripts/release.sh
          printf '%s' "$BROWSIFY_UPDATE_PUBLIC_KEY" > dist/update-public-key.txt
      - name: Verify release bundle and archive
        run: |
          plutil -lint apps/browsify/build/Browsify.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/browsify/build/Browsify.app/Contents/Info.plist)" = "${RELEASE_TAG#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' apps/browsify/build/Browsify.app/Contents/Info.plist)" = "${RELEASE_TAG#v}"
          test -s apps/browsify/build/Browsify.app/Contents/Resources/ui/index.html
          cd dist
          shasum -a 256 -c SHA256SUMS
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          tar -xzf Browsify-arm64.tar.gz -C "$staging"
          codesign --verify --deep --strict "$staging/Browsify.app"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/Browsify-arm64.tar.gz
            dist/SHA256SUMS
            dist/update-public-key.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Sign update archive
        env:
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.BROWSIFY_UPDATE_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY: ${{ vars.BROWSIFY_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          public_file=$(mktemp)
          trap 'rm -f "$key_file" "$public_file"' EXIT
          test -n "$UPDATE_PRIVATE_KEY_BASE64"
          printf '%s' "$UPDATE_PRIVATE_KEY_BASE64" | base64 --decode > "$key_file"
          openssl pkey -in "$key_file" -pubout -outform DER > "$public_file"
          actual_public=$(tail -c 32 "$public_file" | base64 -w0)
          embedded_public=$(< dist/update-public-key.txt)
          test "$actual_public" = "$UPDATE_PUBLIC_KEY" && test "$actual_public" = "$embedded_public" || { echo 'Update signing key does not match embedded public key'; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$key_file" -in dist/Browsify-arm64.tar.gz -out dist/Browsify-arm64.tar.gz.sig
          test "$(wc -c < dist/Browsify-arm64.tar.gz.sig)" -eq 64
          openssl pkey -in "$key_file" -pubout > "$public_file"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public_file" -in dist/Browsify-arm64.tar.gz -sigfile dist/Browsify-arm64.tar.gz.sig
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          printf '%s\n' 'Requires an Apple Silicon Mac (arm64) and macOS 12 or later. No Intel build is provided.' '' \
            'Not Apple-signed or notarized: macOS Gatekeeper may block initial installation. Install this release manually if upgrading from a check-only version. Subsequent updates use signed packages and require Restart to Update approval.' > release-notes.md
          gh release create "$RELEASE_TAG" Browsify-arm64.tar.gz Browsify-arm64.tar.gz.sig SHA256SUMS \
            --verify-tag --title "Browsify $RELEASE_TAG" --generate-notes --notes-file release-notes.md
