name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/browsify-ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install UI dependencies
        run: |
          chmod +x scripts/install.sh
          ./scripts/install.sh

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build universal binary
        env:
          BUILD_UNIVERSAL: '1'
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Create archive
        run: |
          cd apps/browsify/build
          tar -czf Browsify-universal.tar.gz Browsify.app

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: Browsify-universal
          path: apps/browsify/build/Browsify-universal.tar.gz
          retention-days: 14
