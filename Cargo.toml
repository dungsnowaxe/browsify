[workspace]
resolver = "2"
members = [
    "packages/browsify-core",
    "packages/browsify-js",
    "apps/browsify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/snowaxe/browsify"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = "2.5"
regex = "1.11"
thiserror = "2.0"
rquickjs = { version = "0.8", features = ["parallel"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
